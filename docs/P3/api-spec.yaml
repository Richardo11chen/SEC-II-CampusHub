openapi: "3.0.3"
info:
  title: CampusHub 校园互助服务平台 API
  description: |
    校园互助服务平台（CampusHub）后端 RESTful API。
    基于前后端分离架构，使用 JWT 进行身份认证。

    ## 优先级说明
    - **P0**：核心功能，必须实现
    - **P1**：应做功能
    - **P2**：可选功能

    ## 认证方式
    所有需要认证的接口在请求头中携带：
    ```
    Authorization: Bearer <token>
    ```
  version: "1.0.0"
  contact:
    name: CampusHub Team

servers:
  - url: http://localhost:3000/api
    description: 本地开发环境
  - url: https://api.campushub.example.com/api
    description: 生产环境（HTTPS 必须）

paths:
  # ============================================================
  # Auth - 认证模块 (P0)
  # ============================================================
  /auth/register:
    post:
      tags:
        - 认证 (Auth)
      summary: 用户注册
      description: "对应需求 F01：用户通过学号+密码注册，系统验证学号真实性"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
                - password
                - nickname
              properties:
                studentId:
                  type: string
                  description: 学号（10 位数字）
                  minLength: 10
                  maxLength: 10
                  pattern: "^\d{10}$"
                  example: "2024123456"
                password:
                  type: string
                  description: "密码（长度 8-32 位，必须包含字母和数字）"
                  minLength: 8
                  maxLength: 32
                  pattern: "^(?=.*[A-Za-z])(?=.*\d).{8,32}$"
                  example: "Abc12345"
                nickname:
                  type: string
                  description: 昵称
                  minLength: 1
                  maxLength: 20
                  example: "小明"
                name:
                  type: string
                  description: 真实姓名（选填）
                  maxLength: 20
                  example: "张明"
                email:
                  type: string
                  format: email
                  maxLength: 100
                  description: 邮箱（选填）
                  example: "zhangming@smail.nju.edu.cn"
                avatar:
                  type: string
                  format: uri
                  maxLength: 500
                  description: 头像 URL（选填）
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "注册成功"
                  data:
                    $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 学号已注册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags:
        - 认证 (Auth)
      summary: 用户登录
      description: "对应需求 F01：用户通过学号+密码登录，返回 JWT token。登录失败 5 次后触发临时锁定"
      security: []
      x-rate-limit:
        maxRequests: 20
        windowSeconds: 60
        description: "登录接口限流：每 IP 每分钟最多 20 次"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
                - password
              properties:
                studentId:
                  type: string
                  description: 学号
                  minLength: 10
                  maxLength: 10
                  pattern: "^\d{10}$"
                  example: "2024123456"
                password:
                  type: string
                  description: 密码
                  minLength: 8
                  maxLength: 32
                  example: "Abc12345"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "登录成功"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT 访问令牌
                        example: "eyJhbGciOiJIUzI1NiIs..."
                      refreshToken:
                        type: string
                        description: "刷新令牌（用于获取新的 access token，有效期 7 天）"
                        example: "eyJhbGciOiJIUzI1NiIs..."
                      expiresIn:
                        type: integer
                        description: Token 有效期（秒）
                        example: 3600
                      user:
                        $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 学号或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags:
        - 认证 (Auth)
      summary: 用户登出
      description: "将当前 JWT token 和 refresh token 加入黑名单（需要 Redis 支持）"
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: 刷新令牌（选填，若传入则一并失效）
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "登出成功"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      tags:
        - 认证 (Auth)
      summary: 刷新访问令牌
      description: "使用 refresh token 获取新的 access token，采用轮转策略（旧 refresh token 同时失效）"
      x-rate-limit:
        maxRequests: 30
        windowSeconds: 60
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: 登录时获得的刷新令牌
                  example: "eyJhbGciOiJIUzI1NiIs..."
      responses:
        "200":
          description: Token 刷新成功，旧的 refresh token 同时失效
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Token 刷新成功"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: 新的 JWT 访问令牌
                      refreshToken:
                        type: string
                        description: 新的刷新令牌
                      expiresIn:
                        type: integer
                        description: Token 有效期（秒）
                        example: 3600
        "401":
          description: "refresh token 无效或已过期"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================
  # Users - 用户管理 (P0)
  # ============================================================
  /users/me:
    get:
      tags:
        - 用户 (User)
      summary: 获取当前用户个人信息
      description: "对应需求 F02、F05：获取个人资料，敏感信息脱敏展示"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功获取个人信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - 用户 (User)
      summary: 更新当前用户个人信息
      description: "对应需求 F02、F04：编辑个人资料，可配置真实姓名展示开关"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  description: 昵称
                  minLength: 1
                  maxLength: 20
                  example: "小明"
                avatar:
                  type: string
                  format: uri
                  maxLength: 500
                  description: 头像 URL
                  example: "https://oss.example.com/avatars/123.jpg"
                college:
                  type: string
                  maxLength: 50
                  description: 学院
                  example: "计算机科学与技术系"
                phone:
                  type: string
                  description: "联系方式（11 位手机号）"
                  minLength: 11
                  maxLength: 11
                  pattern: "^1[3-9]\\d{9}$"
                  example: "138****1234"
                showRealName:
                  type: boolean
                  description: "是否对外展示真实姓名（对应 F04）"
                  example: false
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "个人信息更新成功"
                  data:
                    $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{userId}/profile:
    get:
      tags:
        - 用户 (User)
      summary: 获取指定用户公开信息
      description: "获取其他用户的公开资料（信用分、评价等），敏感信息脱敏。需要登录态以防止爬虫"
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: 用户 ID
          example: 1
      responses:
        "200":
          description: 成功获取用户公开信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/PublicUserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================
  # Demands - 需求发布与浏览 (P0)
  # ============================================================
  /demands:
    post:
      tags:
        - 需求 (Demand)
      summary: 发布需求
      description: "对应需求 F06、F07：用户发布互助需求"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - category
                - description
              properties:
                title:
                  type: string
                  description: 需求标题
                  minLength: 1
                  maxLength: 100
                  example: "帮取快递——仙林校区"
                description:
                  type: string
                  description: 需求详细描述
                  minLength: 1
                  maxLength: 2000
                  example: "菜鸟驿站有两个包裹，取件码分别是 1-2345 和 1-6789，送到 4 栋楼下即可。"
                category:
                  type: string
                  description: "需求分类"
                  enum:
                    - 快递代取
                    - 学习辅导
                    - 二手交易
                    - 活动组队
                    - 失物招领
                    - 拼车拼单
                    - 找搭子
                    - 咨询答疑
                    - 其他
                  example: "快递代取"
                location:
                  type: string
                  description: 地点
                  example: "仙林校区4栋"
                expectedTime:
                  type: string
                  format: date-time
                  description: 期望完成时间（ISO 8601 格式）
                  example: "2026-05-15T18:00:00Z"
                reward:
                  type: number
                  format: float
                  description: "报酬（0 表示无偿互助，对应 F06）"
                  minimum: 0
                  maximum: 9999
                  default: 0
                  example: 5.0
                isUrgent:
                  type: boolean
                  description: "是否为紧急需求（P1 功能，紧急需求置顶展示，对应 F10）"
                  default: false
                  example: false
                isAnonymous:
                  type: boolean
                  description: "是否匿名发布（P1 功能，对应 F03）"
                  default: false
                  example: false
                images:
                  type: array
                  description: 图片 URL 列表
                  maxItems: 9
                  items:
                    type: string
                    format: uri
                    maxLength: 500
      responses:
        "201":
          description: 发布成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "需求发布成功"
                  data:
                    $ref: "#/components/schemas/Demand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "信用分低于 40 分，禁止发布需求（对应 F22）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags:
        - 需求 (Demand)
      summary: 浏览需求列表（含筛选）
      description: "对应需求 F08、F10：按分类、时间、距离、紧急状态筛选需求列表"
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum:
              - 快递代取
              - 学习辅导
              - 二手交易
              - 活动组队
              - 失物招领
              - 拼车拼单
              - 找搭子
              - 咨询答疑
              - 其他
          description: 按分类筛选
          example: "快递代取"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - 开放
              - 进行中
              - 已完成
              - 已关闭
          description: 按需求状态筛选
          example: "开放"
        - name: keyword
          in: query
          schema:
            type: string
          description: 关键词搜索（匹配标题和描述）
          example: "快递"
        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              - newest
              - oldest
              - reward_high
              - reward_low
          description: 排序方式
          default: newest
          example: "newest"
        - name: isUrgent
          in: query
          schema:
            type: boolean
          description: "筛选紧急需求（P1，对应 F10）"
          example: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码（从 1 开始）
          example: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页条数
          example: 20
      responses:
        "200":
          description: 成功获取需求列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DemandSummary"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /demands/{demandId}:
    get:
      tags:
        - 需求 (Demand)
      summary: 获取需求详情
      description: "对应需求 F09：查看需求详情（含发布者信息、当前状态、是否匿名）"
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
          description: 需求 ID
          example: 1
      responses:
        "200":
          description: 成功获取需求详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/Demand"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - 需求 (Demand)
      summary: 更新需求
      description: "需求方修改已发布的需求（仅限状态为「开放」的需求）"
      security:
        - BearerAuth: []
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  maxLength: 2000
                category:
                  type: string
                  enum:
                    - 快递代取
                    - 学习辅导
                    - 二手交易
                    - 活动组队
                    - 失物招领
                    - 拼车拼单
                    - 找搭子
                    - 咨询答疑
                    - 其他
                location:
                  type: string
                expectedTime:
                  type: string
                  format: date-time
                reward:
                  type: number
                  format: float
                  minimum: 0
                isUrgent:
                  type: boolean
                isAnonymous:
                  type: boolean
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "需求更新成功"
                  data:
                    $ref: "#/components/schemas/Demand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "无权操作（不是发布者或需求已关闭）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - 需求 (Demand)
      summary: 删除需求
      description: "需求方删除已发布的需求（仅限状态为「开放」的需求）"
      security:
        - BearerAuth: []
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "需求已删除"
        "403":
          description: "无权操作"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================
  # Orders - 订单流程管理 (P0)
  # ============================================================
  /orders:
    post:
      tags:
        - 订单 (Order)
      summary: 接单
      description: "对应需求 F12、F13：服务方对「开放」状态的需求点击接单，创建订单"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - demandId
              properties:
                demandId:
                  type: integer
                  description: 需求 ID
                  example: 1
                message:
                  type: string
                  description: 接单留言（选填）
                  maxLength: 500
                  example: "我在四栋，可以帮你取！"
      responses:
        "201":
          description: 接单成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "接单成功"
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "抢单冲突：需求已被其他人接走（使用乐观锁防止并发抢单，对应 F12）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 409
                  message:
                    type: string
                    example: "该需求已被其他人接走"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags:
        - 订单 (Order)
      summary: 查看用户的订单列表
      description: "对应需求 F17：用户查看自己的订单历史记录（作为需求方和服务方）"
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum:
              - publisher
              - provider
          description: "筛选角色：publisher（作为需求方）、provider（作为服务方）。不传则查全部"
          example: "publisher"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - 进行中
              - 待确认
              - 已完成
              - 已取消
              - 纠纷中
          description: 按订单状态筛选
          example: "进行中"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 成功获取订单列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/{orderId}:
    get:
      tags:
        - 订单 (Order)
      summary: 查看订单详情
