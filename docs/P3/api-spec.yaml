        "500":
          $ref: "#/components/responses/InternalError"

  /admin/disputes:
    get:
      tags:
        - 管理后台 (Admin)
      summary: 查看纠纷列表
      description: "对应需求 F31：管理员查看待处理的纠纷申诉"
      security:
        - BearerAuth: []
        - AdminAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - 待处理
              - 已处理
          description: 按处理状态筛选
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 成功获取纠纷列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Dispute"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/disputes/{disputeId}/resolve:
    put:
      tags:
        - 管理后台 (Admin)
      summary: 处理纠纷
      description: "对应需求 F31：管理员处理纠纷，做出裁决"
      security:
        - BearerAuth: []
        - AdminAuth: []
      parameters:
        - name: disputeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolution
              properties:
                resolution:
                  type: string
                  description: 处理结果
                  example: "判定服务方无责，订单按已完成处理"
                action:
                  type: string
                  enum:
                    - complete
                    - cancel
                    - refund
                  description: "操作：完成订单、取消订单、退款"
                  example: "complete"
      responses:
        "200":
          description: 纠纷处理成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "纠纷处理完成"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "该纠纷已处理，不可重复操作"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/applications:
    get:
      tags:
        - 管理后台 (Admin)
      summary: 查看管理员申请列表
      description: "对应需求 F32：查看学生申请成为志愿管理员的请求（P2）"
      security:
        - BearerAuth: []
        - AdminAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - 待审批
              - 已通过
              - 已拒绝
          description: 按审批状态筛选
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 成功获取申请列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminApplication"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/applications/{applicationId}/review:
    put:
      tags:
        - 管理后台 (Admin)
      summary: 审批管理员申请
      description: "对应需求 F32：现有管理员审批新的管理员申请（P2）"
      security:
        - BearerAuth: []
        - AdminAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - approve
                    - reject
                  description: "审批操作：approve（通过）、reject（拒绝）"
                reason:
                  type: string
                  description: "审批意见"
      responses:
        "200":
          description: "审批完成"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "申请已通过"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "该申请已被审批，不可重复操作"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================
  # File Upload - 文件上传
  # ============================================================
  /upload:
    post:
      tags:
        - 文件上传
      summary: 上传文件（头像/图片）
      description: "上传图片，返回 URL（用于头像、需求图片、评价凭证等）"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 上传的文件（支持 jpg/png/gif/webp，最大 10MB）
                  x-file-mime-types:
                    - image/jpeg
                    - image/png
                    - image/gif
                    - image/webp
                  x-file-max-size: 10485760
                type:
                  type: string
                  enum:
                    - avatar
                    - demand
                    - evidence
                  description: "用途：avatar（头像）、demand（需求图片）、evidence（凭证）"
                  example: "avatar"
      responses:
        "201":
          description: 上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "上传成功"
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                        description: 文件访问 URL
                        example: "https://oss.example.com/uploads/abc123.jpg"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT 认证，在请求头中携带：Authorization: Bearer <token>"
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "管理员认证：JWT 中包含 role=admin 字段，与 BearerAuth 使用相同的 Token 格式，但要求管理员角色"

  schemas:
    # -------- 用户相关 --------
    UserProfile:
      description: 当前用户的完整个人信息
      type: object
      properties:
        id:
          type: integer
          example: 1
        studentId:
          type: string
          description: "学号（脱敏展示，如 2024*****456）"
          example: "2024*****456"
        nickname:
          type: string
          example: "小明"
        name:
          type: string
          description: "真实姓名（根据用户设置决定是否展示，对应 F04）"
          example: "张明"
        college:
          type: string
          description: 学院
          example: "计算机科学与技术系"
        phone:
          type: string
          description: "手机号（脱敏展示，如 138****1234）"
          example: "138****1234"
        email:
          type: string
          format: email
          example: "zhangming@smail.nju.edu.cn"
        avatar:
          type: string
          format: uri
          example: "https://oss.example.com/avatars/123.jpg"
        creditScore:
          type: integer
          description: "信用分（初始 70，满分 100，对应 F19）"
          minimum: 0
          maximum: 100
          example: 85
        role:
          type: string
          enum:
            - student
            - admin
          description: "用户角色"
          example: "student"
        showRealName:
          type: boolean
          description: "是否对外展示真实姓名（对应 F04）"
          example: false
        createdAt:
          type: string
          format: date-time

    PublicUserProfile:
      description: 对外的用户公开信息（敏感信息已脱敏）
      type: object
      properties:
        id:
          type: integer
          example: 1
        nickname:
          type: string
          example: "小明"
        name:
          type: string
          nullable: true
          description: "真实姓名（仅在用户允许展示时返回，对应 F04）"
          example: null
        college:
          type: string
          example: "计算机科学与技术系"
        avatar:
          type: string
          format: uri
        creditScore:
          type: integer
          example: 85
        totalOrders:
          type: integer
          description: 完成的订单数
          example: 23
        joinedAt:
          type: string
          format: date-time

    AdminUserItem:
      description: 管理员视图的用户信息
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: string
        nickname:
          type: string
        name:
          type: string
        college:
          type: string
        email:
          type: string
        phone:
          type: string
        creditScore:
          type: integer
        status:
          type: string
          enum:
            - 正常
            - 已禁用
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time

    # -------- 需求相关 --------
    Demand:
      description: 需求详细信息
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "帮取快递——仙林校区"
        description:
          type: string
          example: "菜鸟驿站有两个包裹..."
        category:
          type: string
          example: "快递代取"
        location:
          type: string
          example: "仙林校区4栋"
        expectedTime:
          type: string
          format: date-time
          example: "2026-05-15T18:00:00Z"
        reward:
          type: number
          format: float
          description: "报酬（0 表示无偿）"
          example: 5.0
        status:
          type: string
          enum:
            - 开放
            - 进行中
            - 已完成
            - 已关闭
          example: "开放"
        isUrgent:
          type: boolean
          description: "是否紧急需求（置顶展示，对应 F10）"
          example: false
        isAnonymous:
          type: boolean
          description: "是否匿名发布（对应 F03）"
          example: false
        images:
          type: array
          items:
            type: string
            format: uri
        publisher:
          $ref: "#/components/schemas/PublicUserProfile"
        currentOrder:
          type: object
          nullable: true
          description: "当前订单信息（状态为「进行中」时返回，用于快速查看）"
          properties:
            id:
              type: integer
            provider:
              $ref: "#/components/schemas/PublicUserProfile"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DemandSummary:
      description: 需求列表中的摘要信息
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        location:
          type: string
        reward:
          type: number
          format: float
        status:
          type: string
        isUrgent:
          type: boolean
        isAnonymous:
          type: boolean
        publisher:
          type: object
          properties:
            id:
              type: integer
            nickname:
              type: string
            avatar:
              type: string
              format: uri
            creditScore:
              type: integer
        createdAt:
          type: string
          format: date-time

    # -------- 订单相关 --------
    Order:
      description: 订单信息
      type: object
      properties:
        id:
          type: integer
          example: 1
        demandId:
          type: integer
          example: 1
        demandTitle:
          type: string
          example: "帮取快递——仙林校区"
        publisherId:
          type: integer
          description: 需求方（发布者）ID
          example: 1
        providerId:
          type: integer
          description: 服务方（接单者）ID
          example: 2
        status:
          type: string
          description: "订单状态：进行中 → 待确认 → 已完成 | 已取消 | 纠纷中"
          enum:
            - 进行中
            - 待确认
            - 已完成
            - 已取消
            - 纠纷中
          example: "进行中"
        reward:
          type: number
          format: float
          description: "报酬金额"
          example: 5.0
        isPaid:
          type: boolean
          description: "是否已付款/托管（对应 F15）"
          example: false
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    OrderDetail:
      description: 订单详细信息（含双方信息）
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            publisher:
              $ref: "#/components/schemas/PublicUserProfile"
            provider:
              $ref: "#/components/schemas/PublicUserProfile"
            demand:
              $ref: "#/components/schemas/DemandSummary"

    # -------- 评价相关 --------
    Review:
      description: 评价信息
      type: object
      properties:
        id:
          type: integer
          example: 1
        orderId:
          type: integer
          example: 1
        fromUser:
          $ref: "#/components/schemas/PublicUserProfile"
        toUserId:
          type: integer
          description: 被评价用户 ID
          example: 2
        rating:
          type: integer
          description: "评分（1-5 星）"
          minimum: 1
          maximum: 5
          example: 5
        content:
          type: string
          nullable: true
          example: "非常靠谱，准时送达！"
        createdAt:
          type: string
          format: date-time

    # -------- 通知相关 --------
    Notification:
      description: 系统通知
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - order_taken
            - order_completed
            - order_confirmed
            - order_cancelled
            - review_received
            - dispute_update
          description: "通知类型"
          example: "order_taken"
        title:
          type: string
          example: "接单通知"
        content:
          type: string
          example: "用户「小红」已接取了您的需求「帮取快递」"
        relatedId:
          type: integer
          description: "关联的业务 ID（订单 ID/需求 ID）"
          example: 1
        isRead:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time

    # -------- 消息相关 --------
    Message:
      description: 聊天消息
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        senderId:
          type: integer
        sender:
          type: object
          properties:
            id:
              type: integer
            nickname:
              type: string
            avatar:
              type: string
              format: uri
        contentType:
          type: string
          enum:
            - text
            - image
          example: "text"
        content:
          type: string
          example: "我已经到楼下了"
        createdAt:
          type: string
          format: date-time

    # -------- 纠纷相关 --------
    Dispute:
      description: 纠纷申诉
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        initiatorId:
          type: integer
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
            format: uri
        status:
          type: string
          enum:
            - 待处理
            - 已处理
          example: "待处理"
        resolution:
          type: string
          nullable: true
          description: 处理结果
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    # -------- 管理员申请 --------
    AdminApplication:
      description: 管理员申请
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        applicant:
          $ref: "#/components/schemas/PublicUserProfile"
        reason:
          type: string
          description: 申请理由
        status:
          type: string
          enum:
            - 待审批
            - 已通过
            - 已拒绝
        reviewerId:
          type: integer
          nullable: true
        reviewComment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # -------- 通用 --------
    Pagination:
      description: 分页信息
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          description: 总记录数
          example: 156
        totalPages:
          type: integer
          description: 总页数
          example: 8

    ApiError:
      description: 错误响应
      type: object
      properties:
        code:
          type: integer
          description: "业务状态码（非 HTTP 状态码）"
          example: 400
        message:
          type: string
          description: "错误描述"
          example: "请求参数有误"
        errors:
          type: array
          description: "详细的字段级错误信息（选填）"
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              message:
                type: string
                example: "密码长度至少 8 位"
        timestamp:
          type: string
          format: date-time
          description: "错误发生时间"

  responses:
    BadRequest:
      description: "请求参数错误（400）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: "未认证（401）—— Token 缺失、过期或无效"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: "无权限（403）—— 当前用户角色无权执行此操作"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: "资源不存在（404）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: "请求过于频繁（429）—— 触发频率限制，请稍后重试"
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: "时间窗口内的请求上限"
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: "剩余可用请求数"
        X-RateLimit-Reset:
          schema:
            type: integer
          description: "限流重置的 Unix 时间戳"
        Retry-After:
          schema:
            type: integer
          description: "建议等待的秒数"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: "上传文件过大（413）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: "服务器内部错误（500）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  # -------- 错误码定义 --------
  x-error-codes:
    - code: 200
      description: 请求成功
    - code: 201
      description: 创建成功
    - code: 400
      description: "请求参数错误——缺少必填字段、格式不正确、字段值不在枚举范围内等"
    - code: 401
      description: "认证失败——Token 缺失、过期或无效"
    - code: 403
      description: "权限不足——当前用户角色不允许执行此操作（如普通用户访问管理员接口、信用分＜40发布需求等）"
    - code: 404
      description: "资源不存在——请求的资源（用户/需求/订单等）不存在"
    - code: 409
      description: "资源冲突——数据不满足约束条件（如学号已注册、抢单冲突、重复评价、订单状态不允许操作等）"
    - code: 422
      description: "不可处理的实体——业务规则校验失败（如信用分不足、爽约频率过高等）"
    - code: 500
      description: "服务器内部错误——未预期的异常，请联系管理员"
