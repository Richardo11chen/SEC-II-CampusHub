stages:
  - lint
  - build
  - test

frontend-lint:
  stage: lint
  image: node:lts
  script:
    - cd frontend
    - npm install -g pnpm
    - pnpm ci
    - pnpm lint
    - pnpm check

frontend-build:
  stage: build
  image: node:lts
  script:
    - cd frontend
    - npm install -g pnpm
    - pnpm ci
    - pnpm build
  artifacts:
    paths:
      - frontend/dist/

frontend-test:
  stage: test
  image: node:lts
  script:
    - cd frontend
    - npm install -g pnpm
    - pnpm ci
    - pnpm test
