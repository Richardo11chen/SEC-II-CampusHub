stages:
  - install
  - lint
  - build
  - test

frontend-install:
  stage: install
  image: node:lts
  script:
    - cd frontend && npm install -g pnpm && pnpm ci
  artifacts:
    paths:
      - frontend/node_modules/

frontend-lint:
  stage: lint
  image: node:lts
  needs: [frontend-install]
  script:
    - cd frontend && pnpm lint && pnpm check

frontend-build:
  stage: build
  image: node:lts
  needs: [frontend-install]
  script:
    - cd frontend && pnpm build
  artifacts:
    paths:
      - frontend/dist/

frontend-test:
  stage: test
  image: node:lts
  needs: [frontend-install]
  script:
    - cd frontend && pnpm test
