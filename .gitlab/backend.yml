stages:
  - lint
  - build
  - test

backend-lint:
  stage: lint
  image: node:lts
  script:
    - cd backend
    - npm ci
    - echo "lint"
    - echo "check"

backend-build:
  stage: build
  image: node:lts
  script:
    - cd backend
    - npm ci
    - echo "build"
  artifacts:
    paths:
      - backend/dist/

backend-test:
  stage: test
  image: node:lts
  script:
    - cd backend
    - npm ci
    - echo "test"